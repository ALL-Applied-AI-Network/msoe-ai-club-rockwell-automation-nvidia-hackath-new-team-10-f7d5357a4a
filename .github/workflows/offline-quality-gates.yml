name: Dataset-independent quality gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dataset-independent-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-cpu:
    name: Core CPU and safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the deployment kit's exact CPython patch release.
          python-version: "3.11.17"
          cache: pip
          cache-dependency-path: twin_to_line/requirements_ci.txt
      - name: Install pinned test dependencies
        run: python -m pip install --requirement twin_to_line/requirements_ci.txt
      - name: Run data-independent quality gate
        run: python twin_to_line/ci_quality_gate.py

